---
# Copy to vars/secrets.yml and customize for your environment.
#
# Provider auth is global; per-host provider selection lives in inventory host_vars.

host_secrets_preflight_default_provider: mock

# Shared lookup decoration (per-host host_secret_path_prefix/suffix overrides these).
host_secrets_preflight_path_prefix: ""
host_secrets_preflight_path_suffix: ""

# ---------------------------------------------------------------------------
# HashiCorp Vault example
# ---------------------------------------------------------------------------
# host_secrets_preflight_vault_url: https://vault.example.com
# host_secrets_preflight_vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
# host_secrets_preflight_vault_mount: secret
# host_secrets_preflight_vault_namespace: ""

# Per-host example (inventories/host_vars/db01.yml):
#   host_secret_provider: hashicorp_vault
#   host_secret_id: db01
#   host_secret_path_prefix: prod/linux/
#   host_secret_username_field: username
#   host_secret_password_field: password

# ---------------------------------------------------------------------------
# CyberArk PAS CCP example
# ---------------------------------------------------------------------------
# host_secrets_preflight_cyberark_ccp_url: https://ccp.example.com
# host_secrets_preflight_cyberark_app_id: ansible-aap
# host_secrets_preflight_cyberark_safe: Linux-SSH
# host_secrets_preflight_cyberark_folder: Root
# host_secrets_preflight_cyberark_query_format: Object

# Per-host example:
#   host_secret_provider: cyberark
#   host_secret_id: linux-web01
#   host_secret_cyberark_query_format: Object

# ---------------------------------------------------------------------------
# Bitwarden example (API key / machine account)
# ---------------------------------------------------------------------------
# host_secrets_preflight_bitwarden_identity_url: https://identity.bitwarden.com
# host_secrets_preflight_bitwarden_api_url: https://api.bitwarden.com
# host_secrets_preflight_bitwarden_client_id: "{{ lookup('env', 'BW_CLIENT_ID') }}"
# host_secrets_preflight_bitwarden_client_secret: "{{ lookup('env', 'BW_CLIENT_SECRET') }}"
# host_secrets_preflight_bitwarden_ssh_private_key_field: ssh_private_key
# host_secrets_preflight_bitwarden_ssh_private_key_require_hidden: true

# Per-host example:
#   host_secret_provider: bitwarden
#   host_secret_id: linux-web01-ssh
#   host_secret_require_ssh_private_key: true
#
# In Vaultwarden/Bitwarden, create a Login item named linux-web01-ssh with:
#   - username / password in the login fields
#   - hidden custom field ssh_private_key (type: hidden) for PEM material
