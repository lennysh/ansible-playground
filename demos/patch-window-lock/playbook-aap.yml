---
# AAP Work entry — attach to inventory hosts (Linux; writes /etc/ansible/facts.d).
#
# Lock identity (injected by the controller; do not set these in CaC):
#   awx_workflow_job_id / tower_workflow_job_id  — preferred. Work and the
#     always-node Release job share it, so Release can clear *this* run's
#     lease without treating it as a foreign lock.
#   awx_job_id / tower_job_id                    — fallback when this JT is
#     launched directly (no workflow). In-play always uses the same job id.
#
# Job template / workflow extra vars and survey:
#   patch_lock_owner              host-patch | app-patch (baked on each WJT)
#   patch_lock_fail_on_conflict   survey boolean (default true)
#   patch_lock_force              survey boolean (default false)
#   patch_lock_ttl_minutes        survey integer (Host Patch WJT default 60, App Patch 20)
#   patch_lock_ttl_seconds        optional override; wins over minutes when set
#   patch_lock_hold_seconds       survey integer (default 90) so a second workflow can collide
#
# Privilege escalation is required on the job template (become_enabled).
# Launch the workflow templates, not this job template, so the always-node
# Release job still runs if this job is cancelled.

- name: Patch window (AAP)
  hosts: all
  gather_facts: false
  strategy: linear
  become: true
  vars:
    patch_lock_owner: host-patch
    patch_lock_fact_dir: /etc/ansible/facts.d
    patch_lock_hold_seconds: 90
    patch_lock_ttl_minutes: 60
  tasks:
    - name: Acquire, simulate work, always release
      block:
        - name: Acquire patch lock
          ansible.builtin.import_role:
            name: patch_window_lock
          vars:
            patch_lock_state: acquire

        - name: Simulate patching (hold the lock so a second job can collide)
          ansible.builtin.pause:
            seconds: "{{ patch_lock_hold_seconds | int }}"
          when: (patch_lock_hold_seconds | int) > 0

        - name: Pretend we patched
          ansible.builtin.debug:
            msg: >-
              {{ patch_lock_owner }} completed work on {{ inventory_hostname }}
              (lease ttl_minutes={{ patch_lock_ttl_minutes | int }})
      always:
        - name: Release patch lock
          ansible.builtin.import_role:
            name: patch_window_lock
          vars:
            patch_lock_state: release
