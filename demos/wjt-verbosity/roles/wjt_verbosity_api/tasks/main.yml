---
- name: Normalize target job template list
  ansible.builtin.set_fact:
    wjt_verbosity_target_job_templates_normalized: >-
      {{
        (
          wjt_verbosity_target_job_templates
          if wjt_verbosity_target_job_templates is sequence
             and wjt_verbosity_target_job_templates is not string
          else (
            wjt_verbosity_target_job_templates | default('') | string
            | replace('\r', '') | split('\n')
            | map('trim') | reject('equalto', '') | list
          )
        )
      }}

- name: Validate verbosity mode
  ansible.builtin.assert:
    that:
      - wjt_verbosity_mode in ['set', 'reset']
    fail_msg: "wjt_verbosity_mode must be 'set' or 'reset' (got {{ wjt_verbosity_mode | default('undefined') }})."

- name: Validate target job templates are configured
  ansible.builtin.assert:
    that:
      - wjt_verbosity_target_job_templates_normalized | length > 0
    fail_msg: >-
      wjt_verbosity_target_job_templates is empty. Configure
      wjt_verbosity_target_job_templates on the workflow job template extra_vars
      (or pass -e for CLI runs).

- name: Normalize survey verbosity to controller integer
  ansible.builtin.set_fact:
    wjt_verbosity_level_resolved: >-
      {{
        (
          (wjt_verbosity_level | default(wjt_verbosity_default) | string)
          .split('(') | first | trim
        )
        | int
      }}

- name: Resolve desired controller verbosity
  ansible.builtin.set_fact:
    wjt_verbosity_desired: >-
      {{
        (wjt_verbosity_default | int)
        if wjt_verbosity_mode == 'reset'
        else (wjt_verbosity_level_resolved | int)
      }}

- name: Resolve whether controller API updates are needed
  ansible.builtin.set_fact:
    wjt_verbosity_should_call_api: >-
      {{
        not (
          (
            (wjt_verbosity_level_resolved | int)
            == (wjt_verbosity_default | int)
          )
          and (
            wjt_verbosity_mode == 'set'
            or (
              wjt_verbosity_mode == 'reset'
              and wjt_verbosity_level is defined
            )
          )
        )
      }}

- name: Skip set when survey verbosity matches default
  when:
    - wjt_verbosity_mode == 'set'
    - not (wjt_verbosity_should_call_api | bool)
  ansible.builtin.debug:
    msg: >-
      wjt_verbosity_level is {{ wjt_verbosity_level | default(wjt_verbosity_default) }}
      (default). Skipping job template verbosity updates; sample steps still run
      at their current template verbosity.

- name: Skip reset when survey verbosity matches default
  when:
    - wjt_verbosity_mode == 'reset'
    - not (wjt_verbosity_should_call_api | bool)
  ansible.builtin.debug:
    msg: >-
      wjt_verbosity_level is {{ wjt_verbosity_level }} (default). Skipping
      job template verbosity reset; templates were not elevated for this run.

- name: Update job template verbosity via controller API
  when: wjt_verbosity_should_call_api | bool
  block:
    - name: Apply verbosity to each target job template
      ansible.controller.job_template:
        name: "{{ __wjt_verbosity_jt_name }}"
        organization: >-
          {{
            wjt_verbosity_organization
            if (wjt_verbosity_organization | default('') | length > 0)
            else omit
          }}
        verbosity: "{{ wjt_verbosity_desired | int }}"
        controller_host: "{{ aap_hostname | default(omit, true) }}"
        controller_username: "{{ aap_username | default(omit, true) }}"
        controller_password: "{{ aap_password | default(omit, true) }}"
        controller_oauthtoken: "{{ aap_token | default(omit, true) }}"
        validate_certs: "{{ aap_validate_certs if (aap_validate_certs is defined) else omit }}"
      loop: "{{ wjt_verbosity_target_job_templates_normalized }}"
      loop_control:
        loop_var: __wjt_verbosity_jt_name
        label: "{{ __wjt_verbosity_jt_name }}"
      register: wjt_verbosity_api_results

    - name: Show verbosity update summary
      ansible.builtin.debug:
        msg:
          mode: "{{ wjt_verbosity_mode }}"
          verbosity_applied: "{{ wjt_verbosity_desired | int }}"
          job_templates_updated: "{{ wjt_verbosity_target_job_templates_normalized }}"
          changed: >-
            {{
              wjt_verbosity_api_results.results
              | default([])
              | selectattr('changed', 'defined')
              | selectattr('changed')
              | map(attribute='__wjt_verbosity_jt_name')
              | list
            }}
