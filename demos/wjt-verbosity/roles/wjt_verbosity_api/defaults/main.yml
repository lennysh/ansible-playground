---
# set — apply wjt_verbosity_level to targets; reset — restore wjt_verbosity_default.
wjt_verbosity_mode: set

# Survey / workflow extra var when mode is set (label like "2 (More Verbose)" or int).
wjt_verbosity_level: "{{ wjt_verbosity_default }}"

# Restored verbosity after workflow sample steps and skip threshold for set mode.
wjt_verbosity_default: 0

# Job template names to update (list). Set on the workflow job template extra_vars.
wjt_verbosity_target_job_templates: []

# Organization for job template API lookups (workflow extra_vars).
wjt_verbosity_organization: ""
