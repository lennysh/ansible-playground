---
# Two ways to use facts.d on a managed host:
#   Part 1 — default directory /etc/ansible/facts.d (omit fact_path on setup / gather_facts)
#   Part 2 — custom directory via fact_path on setup (and optionally as a play keyword)
- name: "Part 1 — default facts.d (/etc/ansible/facts.d)"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tags: [default-facts, local-facts]
  vars:
    demo_default_fact_dir: /etc/ansible/facts.d
    demo_fact_path_label: "default /etc/ansible/facts.d"
    demo_fact_dir: "{{ demo_default_fact_dir }}"
    demo_fact_file: "{{ demo_fact_dir }}/playground-default.fact"
    demo_fact_key: playground-default
    # File only — never remove the whole facts.d directory; other facts may live there.
    demo_cleanup_path: "{{ demo_fact_file }}"
  tasks:
    - name: Note — setup and gather_facts use /etc/ansible/facts.d when fact_path is omitted
      ansible.builtin.debug:
        msg: >-
          Default fact_path is {{ demo_default_fact_dir }}.
          setup is called without fact_path so Ansible reads that directory.
          Cleanup removes only {{ demo_fact_file | basename }}, not other files in facts.d.

    - name: Demonstrate default facts.d write, re-gather, and cleanup
      block:
        - name: Run shared local-facts flow (default path)
          ansible.builtin.include_tasks: tasks/demo_local_facts_flow.yml
      rescue:
        - name: Part 1 skipped — /etc/ansible/facts.d requires working become/root
          ansible.builtin.debug:
            msg: >-
              Could not write to {{ demo_default_fact_dir }} (become failed).
              Part 2 still runs below. Re-run Part 1 on a host with sudo access.
      always:
        - name: Cleanup — remove only our demo fact file (not all of facts.d)
          ansible.builtin.file:
            path: "{{ demo_cleanup_path }}"
            state: absent
          failed_when: false

- name: "Part 2 — custom fact_path (/tmp/...)"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [custom-facts, local-facts]
  vars:
    demo_fact_path_label: "custom fact_path"
    demo_fact_dir: /tmp/ansible-playground-local-facts-demo
    demo_fact_file: "{{ demo_fact_dir }}/playground-custom.fact"
    demo_fact_key: playground-custom
    demo_setup_fact_path: "{{ demo_fact_dir }}"
    # Demo-owned directory — safe to remove entirely.
    demo_cleanup_path: "{{ demo_fact_dir }}"
  tasks:
    - name: Note — pass fact_path to setup to use a non-default directory
      ansible.builtin.debug:
        msg: >-
          fact_path={{ demo_fact_dir }} is passed to setup (can also be a play keyword).
          This directory is demo-owned, so cleanup removes the whole tree.

    - name: Demonstrate custom fact_path write, re-gather, and cleanup
      block:
        - name: Run shared local-facts flow (custom fact_path)
          ansible.builtin.include_tasks: tasks/demo_local_facts_flow.yml
      always:
        - name: Cleanup — remove demo-owned facts.d directory
          ansible.builtin.file:
            path: "{{ demo_cleanup_path }}"
            state: absent
