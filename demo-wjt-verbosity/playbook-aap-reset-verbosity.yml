---
# AAP entry — restore Job Template verbosity after workflow sample steps.
#
# Job template extra_vars:
#   wjt_verbosity_target_job_templates — list of JT names to reset
#   wjt_verbosity_default — verbosity to restore (default 0)
#
# Requires AAP Credential on the job template.

- name: Reset job template verbosity after workflow sample steps
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Restore default verbosity on target job templates
      ansible.builtin.include_role:
        name: wjt_verbosity_api
      vars:
        wjt_verbosity_mode: reset
